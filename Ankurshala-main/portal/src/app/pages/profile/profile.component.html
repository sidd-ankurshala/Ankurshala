<div class="profile-container">
    <div class="profile-header">
        <h1>User Profile</h1>
    </div>
    <div class="profile-content" *ngIf="currentUser">
        <div class="profile-picture d-none d-lg-block">
            <img
            [src]="currentUser['Role Name'] == 'Student' ? 'assets/logos/undraw_Exams_re_4ios 1.png': (currentUser['Role Name'] == 'Guardian' ? 'assets/logos/undraw_Exams_re_4ios 1.png' : (currentUser['Role Name'] == 'Teacher' ? 'assets/logos/undraw_Teacher_re_sico 1.png' : 'assets/logos/undraw_Exams_re_4ios 1.png'))"
            alt="Profile Picture">
        </div>
        <div class="profile-details">
            <h2>{{ currentUser.name }}</h2>
            <div class="row">
                <div class="col-12 col-lg-6" *ngFor="let key of getKeys()">
                    <p class="border rounded m-2 p-2 px-3">
                        <strong>{{ key }}:</strong> {{ currentUser[key] }}
                    </p>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="!currentUser">
        <!-- Bootstrap FontAwesome Loader -->
        <div class="d-flex justify-content-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col">
                <h3 class="mb-4">Your Profiles</h3>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUpdateProfileModal"
                    (click)="addProfile()">
                    <i class="fi fi-rr-add"></i>
                    <span class="ms-2">Add Profile</span>
                </button>
            </div>
        </div>
    </div>
    <div class="card-body">
        <!-- Bordered card with padding, 2 in a row with profile.name and nothing else from currentUser.profiles -->
        <div class="row">
            <div class="col-12 col-md-4" *ngFor="let profile of currentUser.Profiles; let i = index">
                <div class="alert alert-primary">
                    <div class="row">
                        <div class="col-2">
                            <i class="fa fa-user-circle fa-3x"></i>
                        </div>
                        <div class="col-10">
                            <h2>{{ profile.name }}</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
